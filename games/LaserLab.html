<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Laser Lab</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #090f1a;
  color: #c8d8e8;
  font-family: 'Courier New', monospace;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 12px;
  gap: 12px;
  overflow-x: hidden;
}

h1 {
  font-size: clamp(1.25rem, 7.1vw, 2.2rem);
  letter-spacing: 0.18em;
  color: #6ab0d8;
  text-transform: uppercase;
  font-weight: normal;
}

@keyframes blink { to { opacity: 0.55; } }

/* ── Grid ───────────────────────────── */
#grid-wrap {
  position: relative;
  width: min(84vw, 330px);
  aspect-ratio: 1;
}
#grid {
  position: absolute;
  inset: 0;
  display: grid;
  /* grid-template-columns/rows are set per-level in renderGrid() */
  gap: 5px;
  padding: 5px;
  background: #0e1a2a;
  border-radius: 10px;
  border: 1px solid #1c3050;
}

.cell {
  background: #121e2f;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
  position: relative;
  border: 1px solid #1a2e48;
  transition: background 0.12s, border-color 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.cell.interactive { cursor: pointer; }
.cell.interactive:active { background: #1a3050; }

@media (hover: hover) {
  .cell.interactive:hover  { background: #182840; border-color: #2a4868; }
  .cell.removable:hover    { border-color: #c06060; }
}

/* ── Pulse animations ── */
@keyframes source-pulse {
  0%, 100% { box-shadow: 0 0 6px #ffffff33, 0 0 3px #d0e8ff; }
  50%       { box-shadow: 0 0 22px #ffffffbb, 0 0 10px #e8f4ff; }
}
@keyframes source-pulse-green {
  0%, 100% { box-shadow: 0 0 6px #44ff8833, 0 0 3px #80ffaa; }
  50%       { box-shadow: 0 0 22px #44ff88bb, 0 0 10px #80ffaa; }
}
@keyframes laser-pulse {
  0%, 100% { opacity: 0.55; }
  50%       { opacity: 1; }
}

/* ── Flask ──────────────────────────── */
@keyframes flask-explode {
  0%   { transform: scale(1)    rotate(0deg); }
  25%  { transform: scale(1.18) rotate(-8deg); }
  55%  { transform: scale(1.12) rotate(6deg); }
  80%  { transform: scale(1.05) rotate(-3deg); }
  100% { transform: scale(1)    rotate(0deg); }
}
.flask-svg.exploded {
  animation: flask-explode 0.45s ease-out forwards;
  filter: drop-shadow(0 0 7px #ff4422bb);
}

/* ── Source ─────────────────────────── */
.source-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.source-dot {
  width: 44%;
  height: 44%;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #ffffff, #a0b8cc);
  box-shadow: 0 0 10px #ffffff66, 0 0 4px #d0e8ff;
}
.source-dot.color-green {
  background: radial-gradient(circle at 38% 38%, #aaffcc, #3a8860);
  box-shadow: 0 0 10px #44ff8866, 0 0 4px #80ffaa;
}
@keyframes source-pulse-red {
  0%, 100% { box-shadow: 0 0 6px #ff443333, 0 0 3px #ff9080; }
  50%       { box-shadow: 0 0 22px #ff4433bb, 0 0 10px #ff9080; }
}
.source-dot.color-red {
  background: radial-gradient(circle at 38% 38%, #ffaaaa, #882222);
  box-shadow: 0 0 10px #ff443366, 0 0 4px #ff9080;
}
.source-dot.pulsing       { animation: source-pulse       1.2s ease-in-out infinite; }
.source-dot.pulsing-green { animation: source-pulse-green 1.2s ease-in-out infinite; }
.source-dot.pulsing-red   { animation: source-pulse-red   1.2s ease-in-out infinite; }
#laser-svg.pulsing        { animation: laser-pulse         1.2s ease-in-out infinite; }

/* ── Target — white ─────────────────── */
@keyframes target-pulse {
  0%, 100% { box-shadow: 0 0 4px #ffffff22; border-color: #8ab0cc; }
  50%       { box-shadow: 0 0 18px #ffffffcc, 0 0 32px #ffffff44; border-color: #ffffff; }
}
@keyframes inner-pulse {
  0%, 100% { background: #8ab0cc; }
  50%       { background: #ffffff; }
}

/* ── Target — green ─────────────────── */
@keyframes target-pulse-green {
  0%, 100% { box-shadow: 0 0 4px #44ff8822; border-color: #3dd86b; }
  50%       { box-shadow: 0 0 18px #44ff88cc, 0 0 32px #44ff8844; border-color: #88ffaa; }
}
@keyframes inner-pulse-green {
  0%, 100% { background: #3dd86b; }
  50%       { background: #aaffcc; }
}

/* ── Target — red ───────────────────── */
@keyframes target-pulse-red {
  0%, 100% { box-shadow: 0 0 4px #ff443322; border-color: #dd5544; }
  50%       { box-shadow: 0 0 18px #ff4433cc, 0 0 32px #ff443344; border-color: #ff8877; }
}
@keyframes inner-pulse-red {
  0%, 100% { background: #dd5544; }
  50%       { background: #ffaaaa; }
}

/* ── Target — yellow ────────────────── */
@keyframes target-pulse-yellow {
  0%, 100% { box-shadow: 0 0 4px #ccbb0022; border-color: #ccbb00; }
  50%       { box-shadow: 0 0 18px #ffee44cc, 0 0 32px #ffee4444; border-color: #ffee44; }
}
@keyframes inner-pulse-yellow {
  0%, 100% { background: #ccbb00; }
  50%       { background: #ffff88; }
}

.target-outer {
  width: 62%;
  height: 62%;
  border-radius: 50%;
  border: 2.5px solid #8ab0cc;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 5px #4488aa44;
}
.target-outer.color-green              { border-color: #3dd86b; }
.target-outer.color-red                { border-color: #dd5544; }
.target-outer.color-yellow             { border-color: #ccbb00; }
.target-outer.hit                      { animation: target-pulse        1.2s ease-in-out infinite; }
.target-outer.hit-green                { animation: target-pulse-green  1.2s ease-in-out infinite; }
.target-outer.hit-red                  { animation: target-pulse-red    1.2s ease-in-out infinite; }
.target-outer.hit-yellow               { animation: target-pulse-yellow 1.2s ease-in-out infinite; }
.target-inner {
  width: 34%;
  height: 34%;
  border-radius: 50%;
  background: #8ab0cc;
}
.target-inner.color-green              { background: #3dd86b; }
.target-inner.color-red                { background: #dd5544; }
.target-inner.color-yellow             { background: #ccbb00; }
.target-outer.hit        .target-inner { animation: inner-pulse        1.2s ease-in-out infinite; }
.target-outer.hit-green  .target-inner { animation: inner-pulse-green  1.2s ease-in-out infinite; }
.target-outer.hit-red    .target-inner { animation: inner-pulse-red    1.2s ease-in-out infinite; }
.target-outer.hit-yellow .target-inner { animation: inner-pulse-yellow 1.2s ease-in-out infinite; }

/* ── Mirror ─────────────────────────── */
.mirror-bar {
  width: 68%;
  height: 3px;
  background: linear-gradient(90deg, #3a8fcc, #6ab8f0, #3a8fcc);
  box-shadow: 0 0 7px #5ab0e866;
  border-radius: 2px;
}
.mirror-slash  { transform: rotate(-45deg); }
.mirror-bslash { transform: rotate(45deg);  }

/* ── Switch & link badges ───────────── */
.target-outer.square, .target-inner.square { border-radius: 18%; }
.source-dot.off { opacity: 0.3; box-shadow: none; animation: none; }
.badge {
  position: absolute;
  top: 1px;
  right: 1px;
  font-size: 11px;
  line-height: 1;
  padding: 1px 4px 2px;
  border: 1px solid #2a4868;
  border-radius: 4px;
  background: #0a1520;
  color: #5a80a0;
  z-index: 2;
  pointer-events: none;
}

/* ── Combiner ───────────────────────────── */
.combiner-bar {
  width: 68%;
  height: 4px;
  background: linear-gradient(90deg, #ff6666, #ffcc44, #44ff88, #4488ff);
  box-shadow: 0 0 8px #ffffff55;
  border-radius: 2px;
  transform: rotate(-45deg);
}

/* ── SVG laser overlay ───────────────── */
#laser-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}

/* ── Inventory ──────────────────────── */
#inv-wrap {
  width: min(84vw, 330px);
}
#inventory {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}
.inv-slot {
  width: 68px;
  height: 88px;
  background: #0e1a2a;
  border: 2px solid #1c3050;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: border-color 0.14s, background 0.14s, outline-color 0.14s, box-shadow 0.14s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  outline: 2px solid transparent;
  outline-offset: 2px;
}
.inv-slot:not(.depleted):hover { border-color: #4a88b8; background: #14263a; }
.inv-slot.selected             { border-color: #4a88b8; background: #0e2a1a; outline-color: #3dd86b; box-shadow: 0 0 8px #3dd86b55; }
.inv-slot.depleted             { opacity: 0.28; cursor: not-allowed; }

.inv-icon-wrap {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.inv-icon {
  width: 36px;
  height: 3px;
  background: #5ab0e8;
  box-shadow: 0 0 4px #5ab0e844;
  border-radius: 2px;
}
.inv-slash  { transform: rotate(-45deg); }
.inv-bslash { transform: rotate(45deg);  }

.inv-count-bar {
  width: 100%;
  padding: 3px 0;
  text-align: center;
  font-size: 1.16rem;
  color: #5a80a0;
  letter-spacing: 0.04em;
  border-top: 1px solid #1c3050;
  background: #0a1520;
}

/* ── Banner ─────────────────────────── */
#banner {
  display: none;
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  transform: translateY(-50%);
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 1.1rem 0.5rem;
  background: rgba(9,15,26,0.93);
  z-index: 10;
  text-align: center;
  font-size: 1.1rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
#banner.show { display: flex; }
#banner.win  { border-top: 1.5px solid #3dd86b; border-bottom: 1.5px solid #3dd86b; color: #3dd86b; }
#banner.fail { border-top: 1.5px solid #ff5544; border-bottom: 1.5px solid #ff5544; color: #ff5544; }
#banner-btn {
  padding: 8px 22px;
  background: transparent;
  color: #3dd86b;
  border: 1px solid #3dd86b;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: background 0.12s;
  -webkit-tap-highlight-color: transparent;
}
#banner-btn:hover  { background: rgba(61,216,107,0.12); }
#banner-btn:active { background: rgba(61,216,107,0.22); }
#banner-btn.fail { color: #ff5544; border-color: #ff5544; }
#banner-btn.fail:hover  { background: rgba(255,85,68,0.12); }
#banner-btn.fail:active { background: rgba(255,85,68,0.22); }

/* ── Buttons ────────────────────────── */
#buttons {
  width: min(84vw, 330px);
}
button {
  padding: 9px 22px;
  background: #0e1a2a;
  color: #5a80a0;
  border: 1px solid #1c3050;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 1.2rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: background 0.12s, color 0.12s;
  -webkit-tap-highlight-color: transparent;
}
button:hover  { background: #14263a; color: #88aac8; }
button:active { background: #1c3050; }
#btn-reset { width: 100%; }

/* ── Level nav ──────────────────────── */
#level-nav {
  display: flex;
  justify-content: center;
  width: min(84vw, 330px);
}
#level-nav-label {
  height: 34px;
  padding: 0 9px;
  background: #0e1a2a;
  color: #3a5878;
  border: 1px solid #1c3050;
  border-radius: 5px 0 0 5px;
  font-size: 1.08rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
}
.lvl-btn-group { display: flex; flex-wrap: wrap; justify-content: center; row-gap: 5px; }
.lvl-btn {
  min-width: 34px;
  height: 34px;
  padding: 0 7px;
  background: #0e1a2a;
  color: #5a80a0;
  border: 1px solid #1c3050;
  border-radius: 0;
  margin-left: -1px;
  cursor: pointer;
  font-family: inherit;
  font-size: 1.08rem;
  letter-spacing: 0.04em;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.lvl-btn-group > button:last-child { border-radius: 0 5px 5px 0; }
.lvl-btn:hover  { background: #14263a; color: #88aac8; z-index: 1; }
.lvl-btn.active { border-color: #4a88b8; color: #3dd86b; background: #0e2a1a; z-index: 2; outline: 2px solid #3dd86b; outline-offset: 2px; box-shadow: 0 0 8px #3dd86b55; }
</style>
</head>
<body>

<h1>&#9879; Laser Lab</h1>
<div id="grid-wrap">
  <div id="grid"></div>
  <svg id="laser-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="banner">
    <div id="banner-msg"></div>
    <button id="banner-btn" hidden></button>
  </div>
</div>

<div id="inv-wrap">
  <div id="inventory"></div>
</div>

<div id="buttons">
  <button id="btn-reset">&#8634; Reset</button>
</div>

<div id="level-nav"></div>

<script>
const DV = {
  right: [0,  1],
  left:  [0, -1],
  up:    [-1, 0],
  down:  [1,  0]
};

const REFLECT = {
  '/':  { right:'up',   up:'right',  left:'down',  down:'left'  },
  '\\': { right:'down', down:'right', left:'up',   up:'left'    }
};

// Relative turns (from the beam's point of view), used by the prism.
const LEFT_OF  = { right:'up',   up:'left',   left:'down', down:'right' };
const RIGHT_OF = { right:'down', down:'left', left:'up',   up:'right'  };

const FLIP_VARIANT = { '/':'\\', '\\':'/' };

const HEX = { white:'#c8d8e8', green:'#3dd86b', red:'#dd5544', yellow:'#ffee44' };
const PORTAL_HEX = { 1:'#bb88ff', 2:'#5ad8d8' };
const VALVE_ANGLE = { right:0, down:90, left:180, up:270 };

// Splitter: white beam entering from a given direction splits into two coloured outputs.
const SPLITTER_OUTPUTS = {
  right: { white: [['right', 'green'], ['up', 'red']] }
};

// Combiner: red reflects using '/' rules; green transmits straight through.
// When both hit the same cell from compatible directions they combine into yellow.
// COMBINER_OUTPUTS[variant][redEntryDir][greenEntryDir] = yellowExitDir
const COMBINER_OUTPUTS = {
  '/': {
    right: { up:   'up'    },
    up:    { right: 'right' },
    left:  { down: 'down'  },
    down:  { left: 'left'  }
  }
};

const LASER_COLORS = {
  white:  { glow: '#c8e8ff', core: '#f0f8ff' },
  green:  { glow: '#80ffaa', core: '#ccffdd' },
  red:    { glow: '#ff9080', core: '#ffcccc' },
  yellow: { glow: '#ffee44', core: '#ffff99' }
};

const COLOR_CSS = {
  white:  { colorClass: '',             hitClass: 'hit',        pulseClass: 'pulsing'       },
  green:  { colorClass: 'color-green',  hitClass: 'hit-green',  pulseClass: 'pulsing-green' },
  red:    { colorClass: 'color-red',    hitClass: 'hit-red',    pulseClass: 'pulsing-red'   },
  yellow: { colorClass: 'color-yellow', hitClass: 'hit-yellow', pulseClass: ''              }
};

// ── Item registry ────────────────────────────────────────────
// Every grid item is defined here in one place. To add a new item type,
// add an entry with:
//   trace(ctx)        how a beam behaves on entering the cell (see below)
//   buildBoardEl(cell, r, c)   the element drawn in the grid
//   buildInvIcon(item)         the inventory icon (placeable items only)
//   resolve(ctx)               optional: emit beams after primary trace settles
//
// trace(ctx) receives { cell, dir, color, r, c, queue } and returns a directive:
//   { pass: true }             beam continues unchanged (passes over the cell)
//   { dir: <newDir> }          beam turns and continues
//   { hitTarget|hitFlask|hitCombiner|hitSwitch: {...} }   beam stops, recording the hit
//   {}                         beam stops with no recorded hit (e.g. splitter)
// A trace may also push spawned beams onto `queue`.
const ITEMS = {
  source: {
    trace: () => ({ pass: true }),
    buildBoardEl: (cell, r, c) => buildSource(cell, r, c)
  },
  target: {
    // cell.color = single-colour target; cell.colors = dual target needing every
    // listed colour to hit it simultaneously (checked in targetIsHit).
    trace: ({ cell, color, r, c }) => ({ hitTarget: {
      r, c, matched: cell.colors ? cell.colors.includes(color) : cell.color === color
    } }),
    buildBoardEl: (cell, r, c) => buildTarget(cell, r, c)
  },
  flask: {
    trace: ({ r, c }) => ({ hitFlask: { r, c } }),
    buildBoardEl: (cell, r, c) => buildFlask(r, c)
  },
  mirror: {
    // cell.sw links the mirror to a switch: while the switch is on, the
    // mirror's variant is flipped ('/' <-> '\').
    trace: ({ cell, dir }) => ({ dir: REFLECT[mirrorVariant(cell)][dir] }),
    buildBoardEl: cell => buildMirrorEl(cell),
    buildInvIcon: item => buildMirrorInvIcon(item)
  },
  splitter: {
    trace: ({ dir, color, r, c, queue }) => {
      const outputs = SPLITTER_OUTPUTS[dir]?.[color];
      if (outputs) for (const [outDir, outColor] of outputs) {
        queue.push({ r, c, dir: outDir, color: outColor });
      }
      return {};
    },
    buildBoardEl: () => buildSplitterEl(),
    buildInvIcon: () => buildSplitterInvIcon()
  },
  combiner: {
    trace: ({ dir, r, c }) => ({ hitCombiner: { r, c, entryDir: dir } }),
    buildBoardEl: () => buildCombinerEl(),
    buildInvIcon: () => buildCombinerInvIcon(),
    resolve: ({ r, c, cell, results, emit }) => {
      const redBeam = results.find(b => b.color === 'red'   && b.hitCombiner?.r === r && b.hitCombiner?.c === c);
      const grnBeam = results.find(b => b.color === 'green' && b.hitCombiner?.r === r && b.hitCombiner?.c === c);
      if (!redBeam || !grnBeam) return;
      const yellowDir = COMBINER_OUTPUTS[cell.variant]?.[redBeam.hitCombiner.entryDir]?.[grnBeam.hitCombiner.entryDir];
      if (yellowDir) emit(yellowDir, 'yellow');
    }
  },
  filter: {
    // Tinted pane: passes exactly its own colour, absorbs everything else.
    trace: ({ cell, color }) => color === cell.color ? { pass: true } : {},
    buildBoardEl: cell => wrapSvg(filterSvg(cell)),
    buildInvIcon: item => asInvIcon(filterSvg(item))
  },
  dichroic: {
    // Dichroic mirror: reflects its own colour, transmits all others.
    trace: ({ cell, dir, color }) =>
      color === cell.color ? { dir: REFLECT[cell.variant][dir] } : { pass: true },
    buildBoardEl: cell => wrapSvg(dichroicSvg(cell)),
    buildInvIcon: item => asInvIcon(dichroicSvg(item))
  },
  prism: {
    // Colour-dependent bending: red turns left, green turns right,
    // white splits into both, yellow passes straight through.
    trace: ({ dir, color, r, c, queue }) => {
      if (color === 'white') {
        queue.push({ r, c, dir: LEFT_OF[dir],  color: 'red' });
        queue.push({ r, c, dir: RIGHT_OF[dir], color: 'green' });
        return {};
      }
      if (color === 'red')   return { dir: LEFT_OF[dir] };
      if (color === 'green') return { dir: RIGHT_OF[dir] };
      return { pass: true };
    },
    buildBoardEl: () => wrapSvg(prismSvg()),
    buildInvIcon: () => asInvIcon(prismSvg())
  },
  dye: {
    // Dye cell: any beam continues straight but leaves in the cell's colour.
    trace: ({ cell, dir, color, r, c, queue }) => {
      if (color === cell.color) return { pass: true };
      queue.push({ r, c, dir, color: cell.color });
      return {};
    },
    buildBoardEl: cell => wrapSvg(dyeSvg(cell)),
    buildInvIcon: item => asInvIcon(dyeSvg(item))
  },
  halfmirror: {
    // Half-silvered mirror: reflects a copy and transmits the original.
    trace: ({ cell, dir, color, r, c, queue }) => {
      queue.push({ r, c, dir: REFLECT[cell.variant][dir], color });
      return { pass: true };
    },
    buildBoardEl: cell => wrapSvg(halfMirrorSvg(cell)),
    buildInvIcon: item => asInvIcon(halfMirrorSvg(item))
  },
  valve: {
    // One-way valve: passes beams travelling in cell.dir, blocks the rest.
    trace: ({ cell, dir }) => dir === cell.dir ? { pass: true } : {},
    buildBoardEl: cell => wrapSvg(valveSvg(cell)),
    buildInvIcon: item => asInvIcon(valveSvg(item))
  },
  blocker: {
    trace: () => ({}),
    buildBoardEl: () => wrapSvg(blockerSvg()),
    buildInvIcon: () => asInvIcon(blockerSvg())
  },
  wall: {
    trace: () => ({}),
    buildBoardEl: () => wrapSvg(wallSvg())
  },
  portal: {
    // Beam enters one portal and exits its twin (same cell.pair) unchanged.
    trace: ({ dir, color, r, c, queue }) => {
      const twin = findTwin(r, c);
      if (twin) queue.push({ r: twin.r, c: twin.c, dir, color });
      return {};
    },
    buildBoardEl: cell => wrapSvg(portalSvg(cell))
  },
  switch: {
    // Square sensor: absorbs any beam, lights up only for its own colour.
    trace: ({ cell, color, r, c }) => ({ hitSwitch: { r, c, lit: color === cell.color } }),
    buildBoardEl: cell => buildSwitchEl(cell)
  },
  shutter: {

  }

// ── State ────────────────────────────────────────────────────
let G, inv, selIdx, won, failed, laserResults, currentLevel, gridSize;
let switchStates, switchMeta, switchChangeCounts, pendingSwitch = null;

function loadLevel(idx) {
  currentLevel = idx;
  const level = LEVELS[idx];
  gridSize = level.size;
  G = Array.from({length: gridSize}, () => Array(gridSize).fill(null));
  for (const f of level.fixed) {
    G[f.r][f.c] = { ...f, fixed: true };
  }
  switchStates = {};
  switchMeta = {};
  for (const f of level.fixed) {
    if (f.type === 'switch') {
      switchStates[f.id] = false;
      switchMeta[f.id] = f.color;
    }
  }
  switchChangeCounts = {};
  clearPendingSwitch();
  inv = level.inventory.map(it => ({ ...it, remaining: it.count }));
  selIdx = null;
  won = false;
  failed = false;
  laserResults = [];
  renderLevelNav();
  render();
}

function reset() { loadLevel(currentLevel); }

// ── Laser trace ──────────────────────────────────────────────
function traceAll() {
  const results = [];
  const queue = [];
  const visited = new Set();

  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      if (G[r][c]?.type === 'source') {
        const s = G[r][c];
        // Switched sources only emit while their switch is on.
        if (!s.sw || switchStates[s.sw]) queue.push({ r, c, dir: s.dir, color: s.color });
      }
    }
  }
  drainQueue(queue, visited, results);

  // Multi-input items (e.g. combiner) resolve after the primary beams settle:
  // they inspect what reached them and may emit new beams.
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const cell = G[r][c];
      const resolve = cell && ITEMS[cell.type]?.resolve;
      if (!resolve) continue;
      resolve({
        r, c, cell, results,
        emit: (dir, color) => {
          const key = `${r},${c},${dir},${color}`;
          if (visited.has(key)) return;
          visited.add(key);
          results.push(traceBeam(r, c, dir, color, queue));
          drainQueue(queue, visited, results);
        }
      });
    }
  }

  return results;
}

function drainQueue(queue, visited, results) {
  while (queue.length) {
    const { r, c, dir, color } = queue.shift();
    const key = `${r},${c},${dir},${color}`;
    if (visited.has(key)) continue;
    visited.add(key);
    results.push(traceBeam(r, c, dir, color, queue));
  }
}

function traceBeam(r0, c0, d0, color, queue) {
  const pts = [[r0, c0]];
  let r = r0, c = c0, d = d0;
  let hitTarget = null, hitFlask = null, hitCombiner = null, hitSwitch = null, exitDir = null;

  for (let i = 0; i < gridSize * gridSize * 2; i++) {
    const [dr, dc] = DV[d];
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nr >= gridSize || nc < 0 || nc >= gridSize) {
      exitDir = d;
      break;
    }
    pts.push([nr, nc]);
    const cell = G[nr][nc];
    const trace = cell && ITEMS[cell.type]?.trace;
    if (!trace) { r = nr; c = nc; continue; }   // empty cell: pass straight through

    const res = trace({ cell, dir: d, color, r: nr, c: nc, queue });
    r = nr; c = nc;
    if (res.pass) continue;                      // beam continues unchanged (e.g. source)
    if (res.dir) { d = res.dir; continue; }      // beam turns (e.g. mirror)
    // otherwise the beam stops here; record whatever it hit
    if (res.hitTarget)   hitTarget = res.hitTarget;
    if (res.hitFlask)    hitFlask = res.hitFlask;
    if (res.hitCombiner) hitCombiner = res.hitCombiner;
    if (res.hitSwitch)   hitSwitch = res.hitSwitch;
    break;
  }
  return { color, pts, hitTarget, hitFlask, hitCombiner, hitSwitch, exitDir };
}

// ── Win / fail checks ────────────────────────────────────────
function isBeamComplete(r0, c0, color, seen = new Set()) {
  const beam = laserResults.find(b => b.color === color && b.pts[0][0] === r0 && b.pts[0][1] === c0);
  if (!beam || seen.has(beam)) return false;
  seen.add(beam);
  if (beam.hitTarget) return beam.hitTarget.matched;
  if (beam.hitSwitch) return beam.hitSwitch.lit;
  let [endR, endC] = beam.pts[beam.pts.length - 1];
  const endCell = G[endR]?.[endC];
  if (endCell?.type === 'combiner') return isBeamComplete(endR, endC, 'yellow', seen);
  // Portals re-emit at their twin; everything else (splitter, prism, dye,
  // half mirror) spawns downstream beams at the cell the beam stopped in.
  if (endCell?.type === 'portal') {
    const twin = findTwin(endR, endC);
    if (!twin) return false;
    endR = twin.r; endC = twin.c;
  }
  const downstream = laserResults.filter(b => b !== beam && b.pts[0][0] === endR && b.pts[0][1] === endC);
  return downstream.length > 0 && downstream.every(b => isBeamComplete(endR, endC, b.color, seen));
}

function findTwin(r, c) {
  const pair = G[r][c]?.pair;
  for (let rr = 0; rr < gridSize; rr++) {
    for (let cc = 0; cc < gridSize; cc++) {
      if ((rr !== r || cc !== c) && G[rr][cc]?.type === 'portal' && G[rr][cc].pair === pair) {
        return { r: rr, c: cc };
      }
    }
  }
  return null;
}

function mirrorVariant(cell) {
  return cell.sw && switchStates[cell.sw] ? FLIP_VARIANT[cell.variant] : cell.variant;
}

function sourceIsHit(r, c) {
  const cell = G[r][c];
  if (!cell || cell.type !== 'source') return false;
  return isBeamComplete(r, c, cell.color);
}

function targetIsHit(r, c) {
  const cell = G[r][c];
  const hits = laserResults.filter(lr =>
    lr.hitTarget?.r === r && lr.hitTarget?.c === c && lr.hitTarget?.matched
  );
  // Dual targets need every listed colour hitting at the same time.
  if (cell?.colors) return cell.colors.every(col => hits.some(b => b.color === col));
  return hits.length > 0;
}

function checkWin() {
  const targets = [];
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      if (G[r][c]?.type === 'target') targets.push({ r, c });
    }
  }
  return targets.length > 0 && targets.every(t => targetIsHit(t.r, t.c));
}

// ── Switch settling ──────────────────────────────────────────
function clearPendingSwitch() {
  if (pendingSwitch) { clearTimeout(pendingSwitch); pendingSwitch = null; }
}

function computeLitSwitches() {
  const lit = {};
  for (const id in switchStates) lit[id] = false;
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const cell = G[r][c];
      if (cell?.type !== 'switch') continue;
      if (laserResults.some(b => b.hitSwitch?.r === r && b.hitSwitch?.c === c && b.hitSwitch.lit)) {
        lit[cell.id] = true;
      }
    }
  }
  return lit;
}

// Re-trace until switch states stop changing. The first time a switch changes
// after the user's last edit it flips instantly; once a switch has already
// changed, further flips are debounced to one per second so cascades (and
// self-affecting loops) pulse visibly instead of resolving invisibly.
// Returns true while a debounced change is still pending.
function settleSwitches() {
  for (let guard = 0; guard < 64; guard++) {
    laserResults = traceAll();
    const ids = Object.keys(switchStates);
    if (!ids.length) return false;
    const lit = computeLitSwitches();
    const changed = ids.filter(id => lit[id] !== switchStates[id]);
    if (!changed.length) return false;
    const fresh = changed.filter(id => !switchChangeCounts[id]);
    if (!fresh.length) {
      pendingSwitch = setTimeout(() => {
        pendingSwitch = null;
        for (const id of changed) {
          switchStates[id] = lit[id];
          switchChangeCounts[id] = (switchChangeCounts[id] || 0) + 1;
        }
        render();
      }, 1000);
      return true;
    }
    for (const id of fresh) {
      switchStates[id] = lit[id];
      switchChangeCounts[id] = (switchChangeCounts[id] || 0) + 1;
    }
  }
  return false;
}

// ── Render ───────────────────────────────────────────────────
function render() {
  clearPendingSwitch();
  const pending = settleSwitches();
  failed = !pending && laserResults.some(res => res.hitFlask);
  won = !failed && !pending && checkWin();
  renderGrid();
  renderInventory();
  renderBanner();
  requestAnimationFrame(renderLaser);
}

function renderGrid() {
  const el = document.getElementById('grid');
  el.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
  el.style.gridTemplateRows    = `repeat(${gridSize}, 1fr)`;
  el.innerHTML = '';
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const cell = G[r][c];
      const div = document.createElement('div');
      div.className = 'cell';

      if (!cell) {
        div.classList.add('interactive');
        div.addEventListener('click', () => onEmptyClick(r, c));
      } else {
        div.appendChild(ITEMS[cell.type].buildBoardEl(cell, r, c));
        const swId = cell.type === 'switch' ? cell.id : cell.sw;
        if (swId) div.appendChild(buildBadge(swId));
        if (!cell.fixed) {
          div.classList.add('removable', 'interactive');
          div.addEventListener('click', () => onPlacedClick(r, c));
        }
      }
      el.appendChild(div);
    }
  }
}

const SVG_NS = 'http://www.w3.org/2000/svg';

function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

// Rainbow bar drawn along the '/' diagonal, shared by splitter and combiner.
// Two coordinate sets: 44-unit board icons and 28-unit inventory icons.
const RAINBOW_BAR = {
  board: { stroke: '3.5', segs: [['#ff6666','8,36','16,28'],['#ffcc44','16,28','24,20'],['#44ff88','24,20','30,14'],['#4488ff','30,14','36,8']] },
  inv:   { stroke: '2.5', segs: [['#ff6666','5,23','10,18'],['#ffcc44','10,18','15,13'],['#44ff88','15,13','19,9'],['#4488ff','19,9','23,5']] }
};

// Builds a square SVG containing the rainbow bar plus the given arrows.
// `arrows` is an array of { points, fill }. `scale` is 'board' or 'inv'.
function buildRainbowSvg(scale, arrows) {
  const board = scale === 'board';
  const svg = svgEl('svg', board
    ? { viewBox: '0 0 44 44', width: '88%', height: '88%' }
    : { viewBox: '0 0 28 28', width: '38', height: '38' });
  const { stroke, segs } = RAINBOW_BAR[scale];
  for (const [col, p1, p2] of segs) {
    const [x1, y1] = p1.split(',');
    const [x2, y2] = p2.split(',');
    svg.appendChild(svgEl('line', { x1, y1, x2, y2, stroke: col, 'stroke-width': stroke, 'stroke-linecap': 'round' }));
  }
  for (const a of arrows) svg.appendChild(svgEl('polygon', { points: a.points, fill: a.fill }));
  return svg;
}

function buildSource(cell, r, c) {
  const off = cell.sw && !switchStates[cell.sw];
  const hit = !off && sourceIsHit(r, c);
  const cs = COLOR_CSS[cell.color] ?? COLOR_CSS.white;
  const wrap = document.createElement('div');
  wrap.className = 'source-wrap';
  const dot = document.createElement('div');
  dot.className = ['source-dot', cs.colorClass, off ? 'off' : '', hit ? cs.pulseClass : '']
    .filter(Boolean).join(' ');
  wrap.appendChild(dot);
  return wrap;
}

function buildTarget(cell, r, c) {
  if (cell.colors) return buildDualTarget(cell, r, c);
  const hit = targetIsHit(r, c);
  const cs = COLOR_CSS[cell.color] ?? COLOR_CSS.white;
  const outer = document.createElement('div');
  outer.className = ['target-outer', cs.colorClass, hit ? cs.hitClass : '']
    .filter(Boolean).join(' ');
  const inner = document.createElement('div');
  inner.className = ['target-inner', cs.colorClass].filter(Boolean).join(' ');
  outer.appendChild(inner);
  return outer;
}

function buildDualTarget(cell, r, c) {
  const hit = targetIsHit(r, c);
  const [h0, h1] = cell.colors.map(col => HEX[col]);
  const svg = itemSvg();
  svg.appendChild(svgEl('path', { d:'M22,8 A14,14 0 0 0 22,36', fill:'none', stroke:h0, 'stroke-width':2.5 }));
  svg.appendChild(svgEl('path', { d:'M22,8 A14,14 0 0 1 22,36', fill:'none', stroke:h1, 'stroke-width':2.5 }));
  svg.appendChild(svgEl('circle', { cx:18.5, cy:22, r:4, fill:h0 }));
  svg.appendChild(svgEl('circle', { cx:25.5, cy:22, r:4, fill:h1 }));
  if (hit) svg.style.filter = 'drop-shadow(0 0 5px #ffffffaa)';
  return wrapSvg(svg);
}

function buildSwitchEl(cell) {
  const lit = switchStates[cell.id];
  const cs = COLOR_CSS[cell.color] ?? COLOR_CSS.white;
  const outer = document.createElement('div');
  outer.className = ['target-outer', 'square', cs.colorClass, lit ? cs.hitClass : '']
    .filter(Boolean).join(' ');
  const inner = document.createElement('div');
  inner.className = ['target-inner', 'square', cs.colorClass].filter(Boolean).join(' ');
  outer.appendChild(inner);
  return outer;
}

function buildBadge(id) {
  const b = document.createElement('div');
  b.className = 'badge';
  b.textContent = id;
  if (switchStates[id]) {
    const hex = HEX[switchMeta[id]] ?? HEX.white;
    b.style.color = hex;
    b.style.borderColor = hex;
    b.style.boxShadow = `0 0 6px ${hex}aa`;
  }
  return b;
}

function buildFlask(row, col) {
  const isHit = laserResults.some(res => res.hitFlask?.r === row && res.hitFlask?.c === col);
  const wrap = document.createElement('div');
  wrap.className = 'source-wrap';
  const svg = svgEl('svg', {
    viewBox: '0 0 44 44', width: '88%', height: '88%',
    class: 'flask-svg' + (isHit ? ' exploded' : '')
  });

  const stroke = isHit ? '#ff6633' : '#6ab0c0';

  // Flask body (Erlenmeyer shape)
  svg.appendChild(svgEl('path', {
    d: 'M 18,7 L 18,17 L 6,37 L 38,37 L 26,17 L 26,7 Z',
    fill: isHit ? 'rgba(255,110,50,0.22)' : 'rgba(100,210,220,0.10)',
    stroke, 'stroke-width': '1.5', 'stroke-linejoin': 'round'
  }));

  // Stopper / cork
  svg.appendChild(svgEl('rect', {
    x: '15', y: '4', width: '14', height: '5', rx: '1.5',
    fill: isHit ? 'rgba(200,80,40,0.45)' : 'rgba(120,170,190,0.35)',
    stroke, 'stroke-width': '1'
  }));

  if (!isHit) {
    // Liquid fill (green chemical)
    svg.appendChild(svgEl('path', { d: 'M 10,34 L 16,21 L 28,21 L 34,34 Z', fill: 'rgba(80,210,110,0.38)' }));
    // Bubbles
    [[20,27,2.2],[25,24,1.6],[22,31,1.3]].forEach(([cx,cy,r]) =>
      svg.appendChild(svgEl('circle', { cx, cy, r, fill: 'rgba(160,255,190,0.55)' })));
  } else {
    // Exploded: hot liquid spill
    svg.appendChild(svgEl('path', { d: 'M 10,34 L 16,21 L 28,21 L 34,34 Z', fill: 'rgba(255,120,40,0.45)' }));
    // Crack lines
    [['M 20,9 L 24,17', 1.8], ['M 13,23 L 8,33', 1.5], ['M 30,25 L 36,32', 1.5]].forEach(([d, sw]) =>
      svg.appendChild(svgEl('path', { d, stroke: '#ffaa77', 'stroke-width': sw, fill: 'none', 'stroke-linecap': 'round' })));
    // Explosion sparks
    [[12,14,3.5],[32,12,2.5],[22,6,2],[36,20,2]].forEach(([cx,cy,r]) =>
      svg.appendChild(svgEl('circle', { cx, cy, r, fill: 'rgba(255,180,60,0.7)' })));
  }

  wrap.appendChild(svg);
  return wrap;
}

function buildMirrorEl(cell) {
  const variant = mirrorVariant(cell);
  if (!cell.sw) {
    const bar = document.createElement('div');
    bar.className = 'mirror-bar ' + (variant === '/' ? 'mirror-slash' : 'mirror-bslash');
    return bar;
  }
  // Switched flip mirror: amber bar plus a faint ghost of the other position.
  const wrap = document.createElement('div');
  wrap.className = 'source-wrap';
  wrap.appendChild(flipMirrorBar(FLIP_VARIANT[variant], true));
  wrap.appendChild(flipMirrorBar(variant, false));
  return wrap;
}

function flipMirrorBar(variant, ghost) {
  const b = document.createElement('div');
  b.style.cssText =
    `position:absolute; width:68%; height:3px; left:16%; top:calc(50% - 1.5px);` +
    `border-radius:2px; transform:rotate(${variant === '/' ? -45 : 45}deg);` +
    (ghost
      ? 'background:#3a5878; opacity:0.35;'
      : 'background:linear-gradient(90deg,#cc8f3a,#f0c46a,#cc8f3a); box-shadow:0 0 7px #e8b05a66;');
  return b;
}

function buildMirrorInvIcon(item) {
  const icon = document.createElement('div');
  icon.className = 'inv-icon ' + (item.variant === '/' ? 'inv-slash' : 'inv-bslash');
  return icon;
}

// ── New item graphics ────────────────────────────────────────
// Each builder returns a 44-unit SVG used both on the board (wrapped via
// wrapSvg) and in the inventory (sized via asInvIcon). Builders take either
// a grid cell or an inventory item — both carry color/variant/dir.
function itemSvg() {
  return svgEl('svg', { viewBox: '0 0 44 44', width: '88%', height: '88%' });
}

function wrapSvg(svg) {
  const w = document.createElement('div');
  w.className = 'source-wrap';
  w.appendChild(svg);
  return w;
}

function asInvIcon(svg) {
  svg.setAttribute('width', '38');
  svg.setAttribute('height', '38');
  return svg;
}

function diagCoords(variant) {
  return variant === '/' ? [10, 34, 34, 10] : [10, 10, 34, 34];
}

function filterSvg(item) {
  const hex = HEX[item.color];
  const svg = itemSvg();
  svg.appendChild(svgEl('rect', { x:11, y:11, width:22, height:22, rx:3, fill:hex + '26', stroke:hex, 'stroke-width':2 }));
  for (const x of [17, 22, 27]) {
    svg.appendChild(svgEl('line', { x1:x, y1:15, x2:x, y2:29, stroke:hex + '66', 'stroke-width':1.5 }));
  }
  return svg;
}

function dichroicSvg(item) {
  const [x1, y1, x2, y2] = diagCoords(item.variant);
  const svg = itemSvg();
  svg.appendChild(svgEl('line', { x1, y1, x2, y2, stroke:HEX[item.color], 'stroke-width':3.5, 'stroke-linecap':'round' }));
  return svg;
}

function halfMirrorSvg(item) {
  const [x1, y1, x2, y2] = diagCoords(item.variant);
  const svg = itemSvg();
  svg.appendChild(svgEl('line', { x1, y1, x2, y2, stroke:'#6ab8f0', 'stroke-width':3, 'stroke-linecap':'round', 'stroke-dasharray':'5 4' }));
  return svg;
}

function prismSvg() {
  const svg = itemSvg();
  svg.appendChild(svgEl('path', { d:'M22,7 L37,35 L7,35 Z', fill:'rgba(190,150,255,0.12)', stroke:'#c8a0ff', 'stroke-width':1.8, 'stroke-linejoin':'round' }));
  svg.appendChild(svgEl('circle', { cx:16, cy:30, r:2.2, fill:HEX.red }));
  svg.appendChild(svgEl('circle', { cx:28, cy:30, r:2.2, fill:HEX.green }));
  return svg;
}

function dyeSvg(item) {
  const hex = HEX[item.color];
  const svg = itemSvg();
  svg.appendChild(svgEl('path', { d:'M22,9 L35,22 L22,35 L9,22 Z', fill:hex + '30', stroke:hex, 'stroke-width':2, 'stroke-linejoin':'round' }));
  return svg;
}

function valveSvg(item) {
  const svg = itemSvg();
  const g = svgEl('g', { transform:`rotate(${VALVE_ANGLE[item.dir]} 22 22)` });
  for (const points of ['12,12 22,22 12,32', '24,12 34,22 24,32']) {
    g.appendChild(svgEl('polyline', { points, fill:'none', stroke:'#88aac8', 'stroke-width':3, 'stroke-linecap':'round', 'stroke-linejoin':'round' }));
  }
  svg.appendChild(g);
  return svg;
}

function blockerSvg() {
  const svg = itemSvg();
  svg.appendChild(svgEl('rect', { x:9, y:9, width:26, height:26, rx:4, fill:'#3a4a5e', stroke:'#6a88a8', 'stroke-width':1.5 }));
  svg.appendChild(svgEl('line', { x1:16, y1:16, x2:28, y2:28, stroke:'#243246', 'stroke-width':2.5, 'stroke-linecap':'round' }));
  svg.appendChild(svgEl('line', { x1:28, y1:16, x2:16, y2:28, stroke:'#243246', 'stroke-width':2.5, 'stroke-linecap':'round' }));
  return svg;
}

function wallSvg() {
  const svg = itemSvg();
  svg.appendChild(svgEl('rect', { x:7, y:7, width:30, height:30, rx:2, fill:'#1f2c40', stroke:'#33455e', 'stroke-width':1.5 }));
  for (const d of ['M7,17 L37,17', 'M7,27 L37,27', 'M19,7 L19,17', 'M27,17 L27,27', 'M19,27 L19,37']) {
    svg.appendChild(svgEl('path', { d, stroke:'#33455e', 'stroke-width':1.5, fill:'none' }));
  }
  return svg;
}

function portalSvg(cell) {
  const hex = PORTAL_HEX[cell.pair] ?? '#bb88ff';
  const svg = itemSvg();
  svg.appendChild(svgEl('circle', { cx:22, cy:22, r:12, fill:'none', stroke:hex, 'stroke-width':2.5 }));
  svg.appendChild(svgEl('circle', { cx:22, cy:22, r:6.5, fill:'none', stroke:hex, 'stroke-width':1.5, 'stroke-dasharray':'3 3' }));
  svg.appendChild(svgEl('circle', { cx:22, cy:22, r:2, fill:hex }));
  return svg;
}

function shutterSvg(cell) {
  const open = !!switchStates[cell.sw];
  const svg = itemSvg();
  svg.appendChild(svgEl('rect', { x:8, y:8, width:28, height:28, rx:3, fill:'rgba(90,112,144,0.08)', stroke:'#5a7090', 'stroke-width':1.5 }));
  for (const x of [13, 20.25, 27.5]) {
    svg.appendChild(svgEl('rect', { x, y:11, width:3.5, height: open ? 5 : 22, rx:1.5, fill: open ? '#3dd86b' : '#c06060' }));
  }
  return svg;
}

// Splitter: white in (left) → green out (right) + red out (top).
const SPLITTER_ARROWS = {
  board: [{ points: '2,19 2,25 10,22', fill: '#e8f4ff' }, { points: '34,19 34,25 42,22', fill: '#44ff88' }, { points: '19,10 25,10 22,2', fill: '#ff6666' }],
  inv:   [{ points: '1,12 1,16 6,14',  fill: '#e8f4ff' }, { points: '22,12 22,16 27,14', fill: '#44ff88' }, { points: '12,7 16,7 14,1',  fill: '#ff6666' }]
};

// Combiner: red in (left) + green in (bottom) → yellow out (top).
const COMBINER_ARROWS = {
  board: [{ points: '2,19 2,25 10,22', fill: '#ff6666' }, { points: '19,42 25,42 22,34', fill: '#44ff88' }, { points: '19,10 25,10 22,2', fill: '#ffee44' }],
  inv:   [{ points: '1,12 1,16 6,14',  fill: '#ff6666' }, { points: '12,27 16,27 14,21', fill: '#44ff88' }, { points: '12,7 16,7 14,1',  fill: '#ffee44' }]
};

function rainbowBoardEl(arrows) {
  const wrap = document.createElement('div');
  wrap.className = 'source-wrap';
  wrap.appendChild(buildRainbowSvg('board', arrows));
  return wrap;
}

function buildSplitterEl()      { return rainbowBoardEl(SPLITTER_ARROWS.board); }
function buildSplitterInvIcon() { return buildRainbowSvg('inv', SPLITTER_ARROWS.inv); }
function buildCombinerEl()      { return rainbowBoardEl(COMBINER_ARROWS.board); }
function buildCombinerInvIcon() { return buildRainbowSvg('inv', COMBINER_ARROWS.inv); }

function renderInventory() {
  const el = document.getElementById('inventory');
  el.innerHTML = '';
  inv.forEach((item, idx) => {
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    if (item.remaining <= 0) slot.classList.add('depleted');
    else if (selIdx === idx) slot.classList.add('selected');

    const iconWrap = document.createElement('div');
    iconWrap.className = 'inv-icon-wrap';
    iconWrap.appendChild(ITEMS[item.type].buildInvIcon(item));

    const cnt = document.createElement('div');
    cnt.className = 'inv-count-bar';
    cnt.textContent = item.remaining + '/' + item.count;

    slot.appendChild(iconWrap);
    slot.appendChild(cnt);

    if (item.remaining > 0) {
      slot.addEventListener('click', () => {
        selIdx = (selIdx === idx) ? null : idx;
        render();
      });
    }
    el.appendChild(slot);
  });
}


function makeLaserLine(points, strokeWidth, strokeOpacity, stroke) {
  return svgEl('polyline', {
    points, fill: 'none', stroke,
    'stroke-width': strokeWidth, 'stroke-opacity': strokeOpacity,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round'
  });
}

function renderLaser() {
  const svg = document.getElementById('laser-svg');
  svg.innerHTML = '';
  svg.classList.toggle('pulsing', won);

  if (!laserResults.length) return;

  const wrap = document.getElementById('grid-wrap');
  const cells = document.querySelectorAll('#grid .cell');
  const wr = wrap.getBoundingClientRect();

  function cellRect(r, c) { return cells[r * gridSize + c].getBoundingClientRect(); }
  function center(r, c) {
    const cr = cellRect(r, c);
    return { x: cr.left - wr.left + cr.width / 2,
             y: cr.top  - wr.top  + cr.height / 2 };
  }

  for (const { color, pts, hitTarget, hitFlask, exitDir } of laserResults) {
    if (pts.length < 2) continue;

    const coordPairs = pts.map(([r, c]) => {
      const p = center(r, c);
      return p.x + ',' + p.y;
    });

    // Extend beam to grid edge when it exits without hitting anything
    if (exitDir && !hitTarget && !hitFlask && pts.length > 0) {
      const [lr, lc] = pts[pts.length - 1];
      const cr = cellRect(lr, lc);
      const cx = cr.left - wr.left + cr.width  / 2;
      const cy = cr.top  - wr.top  + cr.height / 2;
      const edgeX = exitDir === 'right' ? cr.right  - wr.left
                  : exitDir === 'left'  ? cr.left   - wr.left : cx;
      const edgeY = exitDir === 'down'  ? cr.bottom - wr.top
                  : exitDir === 'up'    ? cr.top    - wr.top  : cy;
      coordPairs.push(edgeX + ',' + edgeY);
    }

    const points = coordPairs.join(' ');
    const { glow, core } = LASER_COLORS[color] ?? LASER_COLORS.white;
    const w = hitTarget?.matched ? 2 : 1;

    svg.appendChild(makeLaserLine(points, 12 * w, '0.12', glow));
    svg.appendChild(makeLaserLine(points, 5  * w, '0.40', glow));
    svg.appendChild(makeLaserLine(points, 2  * w, '0.95', core));
  }
}

function renderLevelNav() {
  const nav = document.getElementById('level-nav');
  nav.innerHTML = '';
  const group = document.createElement('div');
  group.className = 'lvl-btn-group';
  const label = document.createElement('span');
  label.id = 'level-nav-label';
  label.textContent = 'Level';
  group.appendChild(label);
  LEVELS.forEach((_, idx) => {
    const btn = document.createElement('button');
    btn.className = 'lvl-btn' + (idx === currentLevel ? ' active' : '');
    btn.textContent = idx + 1;
    btn.addEventListener('click', () => { if (idx !== currentLevel) loadLevel(idx); });
    group.appendChild(btn);
  });
  nav.appendChild(group);
}


// ── Interaction ──────────────────────────────────────────────
function onEmptyClick(r, c) {
  if (won || failed || selIdx === null) return;
  const item = inv[selIdx];
  if (item.remaining <= 0) return;
  G[r][c] = { type: item.type, variant: item.variant, color: item.color, dir: item.dir, fixed: false };
  item.remaining--;
  if (item.remaining === 0) selIdx = null;
  userRender();
}

function onPlacedClick(r, c) {
  if (won || failed) return;
  const cell = G[r][c];
  if (!cell || cell.fixed) return;
  const item = inv.find(it =>
    it.type === cell.type && it.variant === cell.variant &&
    it.color === cell.color && it.dir === cell.dir
  );
  if (item) item.remaining++;
  G[r][c] = null;
  userRender();
}

// A user edit resets the switch debounce: each switch may once again
// change once instantly before further changes are slowed to 1s pulses.
function userRender() {
  switchChangeCounts = {};
  render();
}

function renderBanner() {
  const banner = document.getElementById('banner');
  const msg    = document.getElementById('banner-msg');
  const btn    = document.getElementById('banner-btn');
  if (won) {
    banner.className = 'show win';
    const isLast = currentLevel >= LEVELS.length - 1;
    msg.textContent = isLast ? 'All Levels Complete' : 'Level Complete';
    btn.textContent = 'Next Level';
    btn.className = '';
    btn.hidden = isLast;
  } else if (failed) {
    banner.className = 'show fail';
    msg.textContent = 'Flask Exploded!';
    btn.textContent = 'Try Again';
    btn.className = 'fail';
    btn.hidden = false;
  } else {
    banner.className = '';
    btn.hidden = true;
  }
}

document.getElementById('banner-btn').addEventListener('click', () => {
  if (failed) { reset(); }
  else if (currentLevel < LEVELS.length - 1) loadLevel(currentLevel + 1);
});

window.addEventListener('resize', () => requestAnimationFrame(renderLaser));

document.getElementById('btn-reset').addEventListener('click', reset);

loadLevel(0);
</script>
